<body>
<div class="game">
  <div class="hud">
    <div class="title">終電まで、あと30分。</div>
    <div class="meter">距離 <span class="bar"><i id="bar"></i></span><b id="score">0</b></div>
  </div>
  <div class="hero"><div class="pic" aria-label="里奈の二次元イラスト"></div></div>
  <div class="name">里奈</div>
  <div class="dialog">
    <div id="line"></div>
    <div class="choices" id="choices"></div>
    <button class="next" id="next">次へ</button>
  </div>
  <div class="end" id="end">
    <div class="endbox">
      <div class="small">ENDING</div>
      <h1 id="endTitle"></h1>
      <p id="endText"></p>
      <button onclick="restart()">もう一度はじめる</button>
      <div class="small">デモ版 / セーブなし / 画像はAI生成</div>
    </div>
  </div>
</div>
<script>
const scenes=[
 {text:"「あ……あなたも雨宿り？」\n会社帰り、駅前の小さな喫茶店。隣の部署の里奈と、偶然ふたりきりになった。",choices:[["うん。まさか里奈さんに会うとは",2,"素直な反応に、里奈が少し笑った。"],["別に。すぐ帰るつもりだった",0,"里奈は少しだけ視線を落とした。"],["これは運命かもね",1,"「そういうこと、さらっと言うんだ」"]]},
 {text:"「私、今日ちょっと失敗しちゃって。帰る前に気持ちを切り替えたくて」\nいつも明るい彼女が、珍しく弱音をこぼす。",choices:[["話したくなったら聞くよ",3,"「……ありがとう。そういうの、助かる」"],["気にしない方がいいよ",1,"「うん。そうできたらいいんだけどね」"],["失敗する里奈さんも見てみたい",0,"「それ、慰めてる？」と苦笑された。"]]},
 {text:"里奈はカップを両手で包みながら窓の外を見る。\n「雨、止まないね。終電まであと20分か……」",choices:[["もう少し降っててもいいかも",3,"里奈は一瞬きょとんとして、それから頬を緩めた。"],["タクシー呼ぼうか？",1,"「優しいね。でも、もう少しここにいたいかも」"],["走れば間に合うよ",0,"「現実的だなあ」と笑われた。"]]},
 {text:"「ねえ。会社だと、私とあんまり話さないよね？」\n不意に、里奈がこちらを見る。",choices:[["緊張するから",3,"「……それ、私のせい？」照れたように目を逸らした。"],["仕事中は集中してるだけ",1,"「そっか。真面目なんだね」"],["話す理由がなかったから",0,"「それはそうなんだけど……」"]]},
 {text:"店員が閉店時間を告げる。雨は小降りになっていた。\n里奈は傘を開き、少し迷ってからあなたを見る。\n「駅まで……一緒に行く？」",choices:[["もちろん。入れてもらっていい？",3,"「近いけど……濡れるよりいいよね」"],["俺の傘もあるよ。並んで行こう",2,"「うん。それもいいね」"],["先に行ってて",0,"「……分かった。また明日ね」"]]}
];
let idx=0, affection=0, waiting=false;
const $=id=>document.getElementById(id);
function render(){if(idx>=scenes.length)return finish();const s=scenes[idx];$("line").innerText=s.text;$("choices").innerHTML="";$("next").style.display="none";waiting=false;s.choices.forEach(([label,delta,reaction])=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>choose(delta,reaction);$("choices").appendChild(b);});}
function choose(delta,reaction){if(waiting)return;waiting=true;affection+=delta;$("score").textContent=affection;$("bar").style.width=Math.min(100,8+affection*6.3)+"%";$("choices").innerHTML="";$("line").innerText=reaction;$("next").style.display="block";}
$("next").onclick=()=>{idx++;render();};
function finish(){let t,p;if(affection>=13){t="雨が止んでも";p="駅の入口で、里奈は足を止めた。\n「今度は偶然じゃなくて……一緒にご飯、行かない？」\n終電のベルが鳴る。けれど二人の時間は、ここから始まった。";}else if(affection>=7){t="また、明日";p="駅までの短い道のりは、思っていたより楽しかった。\n「会社でも、もう少し話そっか」\nその一言が、次のきっかけになりそうだった。";}else{t="雨宿りの夜";p="里奈とは駅で別れた。\n特別なことは起きなかったけれど、いつもと違う表情を知った夜だった。";}$("endTitle").textContent=t;$("endText").innerText=p;$("end").style.display="grid";}
function restart(){idx=0;affection=0;waiting=false;$("score").textContent=0;$("bar").style.width="8%";$("end").style.display="none";render();}
render();
</script>
