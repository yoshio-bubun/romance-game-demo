:root{

*{box-sizing:border-box}

body{overflow:hidden}
button{font:inherit}
.game{height:100dvh;position:relative;overflow:hidden;background:

.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}

.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink));transition:.35s}
.score{font-weight:800;color:#fff}
.goal{color:var(--gold)}

 background-size:cover;background-position:center 35%;box-shadow:0 28px 90px #000a;border:1px solid #ffffff20;
 position:relative;overflow:hidden;transition:transform .7s ease,filter .7s ease,background-position .7s ease}
.pic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 47%,rgba(8,8,16,.72) 100%);transition:.5s}
.pic.close{transform:scale(1.035);background-position:center 29%}
.pic.soft{filter:saturate(.94) brightness(1.05);background-position:center 39%}
.pic.warm{filter:saturate(1.10) brightness(1.08);background-position:center 34%}
.pic.night{filter:saturate(.78) brightness(.84) contrast(1.05);background-position:center 28%}
.rain{position:absolute;inset:0;z-index:3;opacity:.18;pointer-events:none;
 background:repeating-linear-gradient(110deg,transparent 0 19px,rgba(255,255,255,.28) 20px,transparent 21px 35px);
 background-size:180px 150px;animation:rain .9s linear infinite;transition:opacity .5s}
.rain.off{opacity:0}@keyframes rain{to{background-position:-45px 150px}}
.chapter-badge{position:absolute;left:18px;bottom:207px;z-index:8;background:linear-gradient(90deg,var(--pink),var(--pink2));
 color:#351a27;font-weight:850;padding:8px 14px;border-radius:11px 11px 0 0;box-shadow:0 10px 25px #0005}
.dialog{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:7;min-height:205px;
 background:var(--panel);border:1px solid var(--line);border-radius:0 18px 18px 18px;padding:19px 16px 14px;
 backdrop-filter:blur(16px);box-shadow:0 22px 54px #0008}
.speaker{font-size:12px;font-weight:750;color:var(--pink2);margin-bottom:5px}
#line{font-size:16px;line-height:1.72;min-height:54px;white-space:pre-line}
.choices{display:grid;gap:8px;margin-top:10px}
.choice,.next,.primary,.secondary{width:100%;padding:11px 13px;border-radius:11px;border:1px solid #ffffff24;
 background:#ffffff0d;color:white;text-align:left;cursor:pointer;transition:.16s}
.choice:hover,.next:hover,.primary:hover,.secondary:hover{transform:translateY(-1px);background:#ffffff18}
.choice.good{border-color:rgba(255,143,183,.35)}
.next{display:none;text-align:center;background:linear-gradient(90deg,#6e62c34a,#c9618c4a)}
.delta{position:absolute;right:18px;bottom:217px;z-index:9;font-weight:900;color:var(--pink2);opacity:0;transform:translateY(8px);transition:.25s;text-shadow:0 2px 8px #000}
.delta.show{opacity:1;transform:translateY(0)}
.overlay{display:none;position:absolute;inset:0;z-index:30;background:rgba(8,8,15,.88);backdrop-filter:blur(15px);
 place-items:center;padding:22px;overflow:auto}
.card{width:min(560px,100%);border:1px solid var(--line);background:linear-gradient(155deg,#252139,#151522);
 border-radius:23px;padding:25px;box-shadow:0 30px 90px #000a}
.eyebrow{font-size:12px;color:var(--pink2);font-weight:850;letter-spacing:.12em}
.card h1{font-size:30px;margin:6px 0 10px}.card p{color:#d8d3e4;line-height:1.75;white-space:pre-line}
.result{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 10px}
.result>div{padding:12px;background:#ffffff0b;border:1px solid #ffffff12;border-radius:13px}
.result small{display:block;color:#a9a3b7;margin-bottom:3px}.result b{font-size:20px}
.primary{margin-top:8px;text-align:center;background:linear-gradient(90deg,#7566d4,#cf668f);font-weight:800}
.secondary{margin-top:8px;text-align:center;color:#d7d2e3}
.chapter-list{display:grid;gap:10px;margin-top:16px}
.chapter-item{border:1px solid var(--line);border-radius:15px;padding:14px;background:#ffffff08}
.chapter-item.unlocked{cursor:pointer}.chapter-item.locked{opacity:.48}
.chapter-item .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.chapter-item b{font-size:15px}.chapter-item small{color:#bdb7ca}
.lock{font-size:12px;color:#aaa}.clear{font-size:12px;color:#ffbdd3;font-weight:800}
.teaser{margin-top:14px;padding:13px;border-left:3px solid var(--pink);background:#ffffff08;color:#d9d5e1;line-height:1.65}
@media(min-width:800px){
 .dialog{left:50%;right:auto;transform:translateX(-50%);width:min(780px,calc(100% - 36px))}
 .chapter-badge{left:calc(50% - 390px);bottom:207px}
 .delta{right:calc(50% - 390px);bottom:217px}
 .stage{inset:58px 0 212px}.pic{width:min(72vw,780px);height:min(66vh,600px)}
}
@media(max-width:560px){
 .status{gap:5px}.bar{width:64px}.goal{display:none}.title{font-size:14px}
 .dialog{min-height:218px}.stage{bottom:238px}.chapter-badge{bottom:220px}.delta{bottom:228px}
}
</style>
</head>
<body>
<div class="game">
  <div class="hud">
    <div class="brand">
      <div class="title">終電まで、あと30分。</div>
      <div class="sub" id="chapterLabel">里奈 ROUTE</div>
    </div>
    <div class="status">
      <span>関係値</span><span class="bar"><i id="bar"></i></span>
      <span class="score" id="score">0</span><span>/100</span>
      <span class="goal" id="goal"></span>
    </div>
  </div>

  <div class="stage"><div class="pic" id="pic" aria-label="里奈のイラスト"></div></div>
  <div class="rain" id="rain"></div>
  <div class="chapter-badge" id="badge">里奈</div>
  <div class="delta" id="delta">+10</div>

  <div class="dialog">
    <div class="speaker" id="speaker">里奈</div>
    <div id="line"></div>
    <div class="choices" id="choices"></div>
    <button class="next" id="next">次へ</button>
  </div>

  <div class="overlay" id="menu">
    <div class="card">
      <div class="eyebrow">RINA ROUTE</div>
      <h1>里奈ルート</h1>
      <p>選択肢で関係値を上げ、各話の目標値を達成すると次の物語が解放されます。</p>
      <div class="chapter-list" id="chapterList"></div>
      <button class="secondary" id="resetSave">進行状況をリセット</button>
    </div>
  </div>

  <div class="overlay" id="result">
    <div class="card">
      <div class="eyebrow" id="resultEyebrow">STORY CLEAR</div>
      <h1 id="resultTitle"></h1>
      <p id="resultText"></p>
      <div class="result">
        <div><small>現在の関係値</small><b id="resultScore"></b></div>
        <div><small>クリア条件</small><b id="resultGoal"></b></div>
      </div>
      <div class="teaser" id="teaser"></div>
      <button class="primary" id="resultPrimary"></button>
      <button class="secondary" id="resultSecondary">話数選択へ</button>
    </div>
  </div>
</div>

<script>
const chapters = [
  {
    id:1,
    title:"第一話　雨宿りの夜",
    short:"雨宿りの夜",
    target:30,
    startScore:0,
    clearTitle:"雨が止んでも",
    clearText:"駅の入口で、里奈は足を止めた。\n「今度は偶然じゃなくて……一緒に帰りたいな」\n\nさっきまで降っていた雨は止んでいた。けれど、二人ともすぐには傘を閉じなかった。",
    teaser:"NEXT STORY\n第二話「雨が止んでも、その先へ」\n――同じ傘の下で、会社では話せなかったことを少しずつ知っていく。",
    scenes:[
      {speaker:"里奈",visual:"soft",rain:true,text:"「あ……あなたも雨宿り？」\n会社帰り、駅前の小さな喫茶店。隣の部署の里奈と、偶然ふたりきりになった。",choices:[
        ["うん。まさか里奈さんに会うとは",8,"素直な反応に、里奈が少し笑った。"],
        ["別に。すぐ帰るつもりだった",2,"里奈は少しだけ視線を落とした。"],
        ["これは運命かもね",5,"「そういうこと、さらっと言うんだ」"]
      ]},
      {speaker:"里奈",visual:"close",rain:true,text:"「私、今日ちょっと失敗しちゃって。帰る前に気持ちを切り替えたくて」\nいつも明るい彼女が、珍しく弱音をこぼす。",choices:[
        ["話したくなったら聞くよ",10,"「……ありがとう。そういうの、助かる」"],
        ["気にしない方がいいよ",4,"「うん。そうできたらいいんだけどね」"],
        ["失敗する里奈さんも見てみたい",1,"「それ、慰めてる？」と苦笑された。"]
      ]},
      {speaker:"里奈",visual:"soft",rain:true,text:"里奈はカップを両手で包みながら窓の外を見る。\n「雨、止まないね。終電まであと20分か……」",choices:[
        ["もう少し降っててもいいかも",10,"里奈は一瞬きょとんとして、それから頬を緩めた。\n「……私もちょっとだけ、そう思った」"],
        ["タクシー呼ぼうか？",5,"「優しいね。でも、もう少しここにいたいかも」"],
        ["走れば間に合うよ",1,"「現実的だなあ」と笑われた。"]
      ]},
      {speaker:"里奈",visual:"close",rain:true,text:"「ねえ。会社だと、私とあんまり話さないよね？」\n不意に、里奈がこちらを見る。",choices:[
        ["緊張するから",10,"「……それ、私のせい？」\n照れたように目を逸らした。"],
        ["仕事中は集中してるだけ",5,"「そっか。真面目なんだね」"],
        ["話す理由がなかったから",0,"「それはそうなんだけど……」"]
      ]},
      {speaker:"里奈",visual:"warm",rain:false,text:"店員が閉店時間を告げる。外を見ると、雨はいつの間にか小降りになっていた。\n里奈は傘を開き、少し迷ってからあなたを見る。\n「駅まで……一緒に行く？」",choices:[
        ["もちろん。入れてもらっていい？",10,"「近いけど……濡れるよりいいよね」\n肩が触れそうな距離で、里奈が笑った。"],
        ["俺の傘もあるよ。並んで行こう",6,"「うん。それもいいね」"],
        ["先に行ってて",0,"「……分かった。また明日ね」"]
      ]}
    ]
  },
  {
    id:2,
    title:"第二話　雨が止んでも、その先へ",
    short:"雨が止んでも、その先へ",
    target:60,
    startScore:30,
    clearTitle:"次の約束",
    clearText:"改札の前。終電の案内が流れる。\n里奈は一度ホームを見て、それからあなたに向き直った。\n\n「今日、偶然会えてよかった」\n「……次は、偶然じゃなくてもいい？」\n\nスマホに増えた一件の予定。二人の関係は、会社の外へ少しだけ進んだ。",
    teaser:"NEXT STORY\n第三話「はじめての約束」\n――休日。待ち合わせ場所に現れた里奈は、会社で見る姿とは少し違っていて……。\n\n※第三話は次回追加予定",
    scenes:[
      {speaker:"里奈",visual:"warm",rain:false,text:"雨上がりの歩道。街灯が濡れたアスファルトに映っている。\n一本の傘に二人で入りながら、駅へ向かう。\n「……雨、もう止んでるのに。まだ傘、差してるね」",choices:[
        ["もう少しこのままでいたい",10,"「……うん。じゃあ、駅までこのまま」\n里奈は傘を閉じなかった。"],
        ["里奈さんが濡れたら困るから",6,"「ふふ。もう降ってないよ？」"],
        ["忘れてた",2,"「もう。そういうところあるよね」"]
      ]},
      {speaker:"里奈",visual:"close",rain:false,text:"駅前の信号で足を止める。\n里奈が小さく息を吐いた。\n「私ね、さっき失敗したって言ったでしょ。あれ、本当は……あなたに聞いてほしかったのかも」",choices:[
        ["どうして俺に？",8,"「なんでだろ。話しやすそうって、前から思ってた」"],
        ["もっと早く話してくれればよかったのに",10,"「会社で？ 無理だよ。意識してるってバレそうだもん」\n言った直後、里奈の表情が固まった。"],
        ["誰でもよかったんじゃない？",0,"「……そう見える？」里奈の歩幅が少し速くなる。"]
      ]},
      {speaker:"里奈",visual:"night",rain:false,text:"駅に着くと、雨の影響で電車が少し遅れていた。\n発車まであと12分。\n「まだ時間あるね。……あっちの自販機、行かない？」",choices:[
        ["温かい飲み物、奢るよ",8,"「じゃあ……ココア。今日だけ甘えていい？」"],
        ["俺も喉乾いてた",5,"「じゃあ一緒に選ぼ」"],
        ["ホームで待とう",1,"「そっか。じゃあ行こっか」"]
      ]},
      {speaker:"里奈",visual:"soft",rain:false,text:"缶を両手で温めながら、里奈が横目でこちらを見る。\n「私たち、こうやって話すの初めてなのに……変な感じしないね」",choices:[
        ["前から話してみたかった",10,"「……それ、もっと早く言ってよ」\n嬉しそうなのに、目は合わせてくれない。"],
        ["里奈が話しやすいから",7,"「それ褒めてる？ なら嬉しいけど」"],
        ["たまたまだよ",1,"「……たまたま、か」"]
      ]},
      {speaker:"里奈",visual:"close",rain:false,text:"発車案内が更新される。あと5分。\n里奈はスマホを見てから、少しだけ躊躇する。\n「ねえ。会社以外でも……また話したいって言ったら、困る？」",choices:[
        ["困らない。むしろ嬉しい",10,"「……よかった」\n里奈の声が、さっきより少し近い。"],
        ["連絡先、交換する？",8,"「うん。実は私も、それ言おうと思ってた」"],
        ["会社で会えるじゃん",0,"「そっか……そうだよね」"]
      ]},
      {speaker:"里奈",visual:"warm",rain:false,text:"連絡先を交換すると、里奈の名前が画面に表示された。\n電車の到着音が遠くから聞こえる。\n「じゃあ最後に一つだけ。今度の休み……空いてる？」",choices:[
        ["空ける。どこ行きたい？",10,"「即答なんだ」\n里奈は笑って、スマホに予定を入力した。"],
        ["予定を確認して連絡する",6,"「うん。待ってるね」"],
        ["まだ分からない",2,"「そっか。分かった」"]
      ]}
    ]
  }
];

let chapterIndex=0, sceneIndex=0, relation=0, waiting=false;
const $=id=>document.getElementById(id);
const SAVE_KEY="rina_route_v2";
let save={unlocked:1,best:0,chapter2Cleared:false};
try{save={...save,...JSON.parse(localStorage.getItem(SAVE_KEY)||"{}")}}catch(e){}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
function openMenu(){
  $("menu").style.display="grid";
  const list=$("chapterList");list.innerHTML="";
  chapters.forEach((c,i)=>{
    const unlocked=c.id<=save.unlocked;
    const el=document.createElement("div");
    el.className="chapter-item "+(unlocked?"unlocked":"locked");
    let state="";
    if(c.id===1 && save.unlocked>=2) state='<span class="clear">CLEAR</span>';
    else if(c.id===2 && save.chapter2Cleared) state='<span class="clear">CLEAR</span>';
    else state=unlocked?'<span class="lock">PLAY</span>':'<span class="lock">LOCK</span>';
    el.innerHTML='<div class="row"><b>'+c.title+'</b>'+state+'</div><small>クリア条件：関係値 '+c.target+' 以上</small>';
    if(unlocked)el.onclick=()=>{ $("menu").style.display="none"; startChapter(i); };
    list.appendChild(el);
  });
}
function startChapter(i){
  chapterIndex=i;sceneIndex=0;waiting=false;
  const c=chapters[i];
  relation=Math.max(c.startScore, i===0?0:Math.min(save.best,100));
  $("chapterLabel").textContent="里奈 ROUTE　"+c.title;
  $("goal").textContent="目標 "+c.target;
  updateScore();
  render();
}
function updateScore(){
  $("score").textContent=relation;
  $("bar").style.width=Math.max(2,Math.min(100,relation))+"%";
}
function setVisual(s){
  const pic=$("pic");pic.className="pic "+(s.visual||"");
  $("rain").className="rain"+(s.rain===false?" off":"");
}
function render(){
  const c=chapters[chapterIndex];
  if(sceneIndex>=c.scenes.length)return finishChapter();
  const s=c.scenes[sceneIndex];
  $("speaker").textContent=s.speaker||"里奈";
  $("badge").textContent=s.speaker||"里奈";
  $("line").innerText=s.text;
  setVisual(s);
  $("choices").innerHTML="";
  $("next").style.display="none";
  waiting=false;
  s.choices.forEach(([label,delta,reaction])=>{
    const b=document.createElement("button");
    b.className="choice"+(delta>=8?" good":"");
    b.textContent=label;
    b.onclick=()=>choose(delta,reaction);
    $("choices").appendChild(b);
  });
}
function choose(delta,reaction){
  if(waiting)return;
  waiting=true;
  relation=Math.min(100,relation+delta);
  save.best=Math.max(save.best,relation);persist();
  updateScore();
  $("choices").innerHTML="";
  $("line").innerText=reaction;
  $("next").style.display="block";
  if(delta>0){
    const d=$("delta");d.textContent="+"+delta;d.classList.add("show");
    setTimeout(()=>d.classList.remove("show"),850);
  }
}
$("next").onclick=()=>{sceneIndex++;render()};
function finishChapter(){
  const c=chapters[chapterIndex];
  const cleared=relation>=c.target;
  $("result").style.display="grid";
  $("resultScore").textContent=relation;
  $("resultGoal").textContent=c.target;
  $("teaser").innerText=cleared?c.teaser:"あと "+(c.target-relation)+" でクリア。\n選択肢を変えて、この話をもう一度プレイできます。";
  $("resultEyebrow").textContent=cleared?"STORY CLEAR":"STORY NOT CLEARED";
  $("resultTitle").textContent=cleared?c.clearTitle:"もう少し、近づけたら";
  $("resultText").innerText=cleared?c.clearText:"里奈との距離は縮まった。けれど、まだ次の物語へ進むには少し足りない。";
  const p=$("resultPrimary");
  if(cleared){
    if(c.id===1){save.unlocked=Math.max(save.unlocked,2);persist();p.textContent="第二話へ進む";p.onclick=()=>{$("result").style.display="none";startChapter(1)}}
    else{save.chapter2Cleared=true;persist();p.textContent="第一話からもう一度";p.onclick=()=>{$("result").style.display="none";startChapter(0)}}
  }else{
    p.textContent="この話をリトライ";
    p.onclick=()=>{$("result").style.display="none";startChapter(chapterIndex)}
  }
}
$("resultSecondary").onclick=()=>{$("result").style.display="none";openMenu()};
$("resetSave").onclick=()=>{
  if(confirm("里奈ルートの進行状況をリセットしますか？")){
    save={unlocked:1,best:0,chapter2Cleared:false};persist();openMenu();
  }
};
openMenu();
</script>
</body>
</html>
